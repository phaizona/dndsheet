<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phaizona's Character Sheet Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Macondo&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sheets/dnd5e.css">
<link rel="stylesheet" href="css/sheets/pathfinder2e.css">
<link rel="stylesheet" href="css/sheets/swade.css">
<link rel="stylesheet" href="css/sheets/fate.css">
<link rel="stylesheet" href="css/sheets/mage20.css">
<link rel="stylesheet" href="css/sheets/vtm5.css">
<link rel="stylesheet" href="css/sheets/l5r.css">
</head>
<body>

<div class="app-shell">

  <aside class="sheet-sidebar">
    <div class="sidebar-brand">
      <div class="brand-title">✦ The Sheet Forge</div>
      <div class="brand-sub">Choose your system</div>
    </div>
    <nav class="sheet-nav" id="sheet-nav"><!-- populated by js/core/app.js --></nav>
    <div class="sidebar-footer">Made by Phaizona</div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-title">
        <span class="t-name" id="topbar-name">—</span>
        <span class="t-tag" id="topbar-tag">—</span>
      </div>
      <div class="topbar-actions no-print">
        <button id="btn-export-png" class="export-btn">⬇ <span class="btn-label">Export PNG</span></button>
        <button id="btn-export-pdf" class="export-btn">⬇ <span class="btn-label">Export PDF</span></button>
      </div>
    </header>

    <div class="sheet-viewport" id="sheet-viewport"><!-- active sheet gets cloned in here --></div>
  </div>

</div>

<!-- ============================================================
     TEMPLATES — one per sheet system. Each root node must be
     .sheet-container; app.js adds orient-* and sheet-<id> classes
     automatically based on the registry in js/core/app.js.
     ============================================================ -->

<!-- ============== D&D 5TH EDITION ============== -->
<template id="tpl-dnd5e">
<div class="sheet-container">
  <header class="sheet-header">
    <div class="header-left">
      <div class="name-container">
        <input type="text" class="h-input char-name-input" placeholder="Character Name" data-field="name">
        <label>CHARACTER NAME</label>
      </div>
    </div>
    <div class="header-right">
      <div class="info-grid">
        <div class="info-cell"><input type="text" class="h-input" data-field="class-level"><label>CLASS &amp; LEVEL</label></div>
        <div class="info-cell"><input type="text" class="h-input" data-field="background"><label>BACKGROUND</label></div>
        <div class="info-cell"><input type="text" class="h-input" data-field="player"><label>PLAYER NAME</label></div>
        <div class="info-cell"><input type="text" class="h-input" data-field="race"><label>RACE</label></div>
        <div class="info-cell"><input type="text" class="h-input" data-field="alignment"><label>ALIGNMENT</label></div>
        <div class="info-cell"><input type="text" class="h-input" data-field="xp"><label>EXPERIENCE POINTS</label></div>
      </div>
    </div>
  </header>

  <main class="sheet-body">
    <div class="col col-1">
      <div class="stats-and-skills">
        <div class="stats-column">
          <div class="stat-box"><label>STRENGTH</label><input type="text" class="stat-score" value="10" data-stat="str" data-field="str"><div class="stat-mod-bg"><input type="text" class="stat-mod" id="mod-str" value="+0" readonly></div></div>
          <div class="stat-box"><label>DEXTERITY</label><input type="text" class="stat-score" value="10" data-stat="dex" data-field="dex"><div class="stat-mod-bg"><input type="text" class="stat-mod" id="mod-dex" value="+0" readonly></div></div>
          <div class="stat-box"><label>CONSTITUTION</label><input type="text" class="stat-score" value="10" data-stat="con" data-field="con"><div class="stat-mod-bg"><input type="text" class="stat-mod" id="mod-con" value="+0" readonly></div></div>
          <div class="stat-box"><label>INTELLIGENCE</label><input type="text" class="stat-score" value="10" data-stat="int" data-field="int"><div class="stat-mod-bg"><input type="text" class="stat-mod" id="mod-int" value="+0" readonly></div></div>
          <div class="stat-box"><label>WISDOM</label><input type="text" class="stat-score" value="10" data-stat="wis" data-field="wis"><div class="stat-mod-bg"><input type="text" class="stat-mod" id="mod-wis" value="+0" readonly></div></div>
          <div class="stat-box"><label>CHARISMA</label><input type="text" class="stat-score" value="10" data-stat="cha" data-field="cha"><div class="stat-mod-bg"><input type="text" class="stat-mod" id="mod-cha" value="+0" readonly></div></div>
        </div>

        <div class="skills-column">
          <div class="small-box-row"><div class="bubble-border"><input type="text" class="circle-input" data-field="inspiration"></div><div class="label-border">INSPIRATION</div></div>
          <div class="small-box-row"><div class="bubble-border"><input type="text" class="circle-input" data-field="prof-bonus"></div><div class="label-border">PROFICIENCY BONUS</div></div>

          <div class="list-box">
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Strength</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Dexterity</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Constitution</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Intelligence</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Wisdom</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Charisma</span></div>
            <div class="box-title">SAVING THROWS</div>
          </div>

          <div class="list-box">
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Acrobatics</span><span class="sub-stat">(Dex)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Animal Handling</span><span class="sub-stat">(Wis)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Arcana</span><span class="sub-stat">(Int)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Athletics</span><span class="sub-stat">(Str)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Deception</span><span class="sub-stat">(Cha)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">History</span><span class="sub-stat">(Int)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Insight</span><span class="sub-stat">(Wis)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Intimidation</span><span class="sub-stat">(Cha)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Investigation</span><span class="sub-stat">(Int)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Medicine</span><span class="sub-stat">(Wis)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Nature</span><span class="sub-stat">(Int)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Perception</span><span class="sub-stat">(Wis)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Performance</span><span class="sub-stat">(Cha)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Persuasion</span><span class="sub-stat">(Cha)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Religion</span><span class="sub-stat">(Int)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Sleight of Hand</span><span class="sub-stat">(Dex)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Stealth</span><span class="sub-stat">(Dex)</span></div>
            <div class="list-item"><input type="checkbox" class="fantasy-checkbox"><input type="text" class="line-input"><span class="skill-name">Survival</span><span class="sub-stat">(Wis)</span></div>
            <div class="box-title">SKILLS</div>
          </div>
        </div>
      </div>

      <div class="small-box-row" style="margin-top:15px;"><div class="bubble-border"><input type="text" class="circle-input" data-field="passive-wis"></div><div class="label-border" style="width:100%;">PASSIVE WISDOM (PERCEPTION)</div></div>

      <div class="text-box-container dynamic-box" style="margin-top:15px;">
        <textarea class="auto-resize" data-field="proficiencies"></textarea>
        <div class="box-title">OTHER PROFICIENCIES &amp; LANGUAGES</div>
      </div>
    </div>

    <div class="col col-2">
      <div class="combat-stats">
        <div class="combat-box shield"><input type="text" class="combat-input" data-field="ac"><label>ARMOR<br>CLASS</label></div>
        <div class="combat-box rounded"><input type="text" class="combat-input" data-field="initiative"><label>INITIATIVE</label></div>
        <div class="combat-box rounded"><input type="text" class="combat-input" data-field="speed"><label>SPEED</label></div>
      </div>

      <div class="hp-container">
        <div class="hp-box dynamic-box">
          <div class="hp-header"><span class="muted">Hit Point Maximum</span><input type="text" class="line-input" style="width:60%;" data-field="hp-max"></div>
          <textarea class="huge-text auto-resize" data-field="hp-current"></textarea>
          <div class="box-title">CURRENT HIT POINTS</div>
        </div>
        <div class="hp-box dynamic-box">
          <textarea class="huge-text auto-resize" data-field="hp-temp"></textarea>
          <div class="box-title">TEMPORARY HIT POINTS</div>
        </div>
      </div>

      <div class="combat-stats">
        <div class="combat-box hit-dice">
          <div class="hp-header"><span class="muted">Total</span><input type="text" class="line-input" style="width:60%;" data-field="hd-total"></div>
          <input type="text" class="huge-text" style="text-align:center;margin-top:-5px;" data-field="hd-current">
          <div class="box-title" style="margin-top:-10px;">HIT DICE</div>
        </div>
        <div class="combat-box death-saves">
          <div class="ds-row"><span>SUCCESSES</span><div class="bubbles"><input type="checkbox" class="bubble-checkbox"><input type="checkbox" class="bubble-checkbox"><input type="checkbox" class="bubble-checkbox"></div></div>
          <div class="ds-row"><span>FAILURES</span><div class="bubbles"><input type="checkbox" class="bubble-checkbox"><input type="checkbox" class="bubble-checkbox"><input type="checkbox" class="bubble-checkbox"></div></div>
          <div class="box-title" style="margin-top:5px;">DEATH SAVES</div>
        </div>
      </div>

      <div class="attacks-box dynamic-box">
        <table class="attack-table">
          <thead><tr><th>NAME</th><th>ATK BONUS</th><th>DAMAGE/TYPE</th></tr></thead>
          <tbody>
            <tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>
            <tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>
            <tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>
          </tbody>
        </table>
        <textarea class="auto-resize" data-field="spellcasting"></textarea>
        <div class="box-title">ATTACKS &amp; SPELLCASTING</div>
      </div>

      <div class="equipment-box dynamic-box">
        <div class="money-col">
          <div class="money-slot"><span>CP</span><input type="text" data-field="cp"></div>
          <div class="money-slot"><span>SP</span><input type="text" data-field="sp"></div>
          <div class="money-slot"><span>EP</span><input type="text" data-field="ep"></div>
          <div class="money-slot"><span>GP</span><input type="text" data-field="gp"></div>
          <div class="money-slot"><span>PP</span><input type="text" data-field="pp"></div>
        </div>
        <div class="eq-textarea-wrapper"><textarea class="auto-resize" data-field="equipment"></textarea></div>
        <div class="box-title eq-title">EQUIPMENT</div>
      </div>
    </div>

    <div class="col col-3">
      <div class="portrait-box" id="portrait-dropzone">
        <input type="file" accept="image/*" class="no-print">
        <div class="portrait-overlay no-print">Click or Drag Image Here</div>
        <div class="box-title">CHARACTER PORTRAIT</div>
      </div>

      <div class="personality-container">
        <div class="trait-box dynamic-box"><textarea class="auto-resize" data-field="traits"></textarea><div class="box-title">PERSONALITY TRAITS</div></div>
        <div class="trait-box dynamic-box"><textarea class="auto-resize" data-field="ideals"></textarea><div class="box-title">IDEALS</div></div>
        <div class="trait-box dynamic-box"><textarea class="auto-resize" data-field="bonds"></textarea><div class="box-title">BONDS</div></div>
        <div class="trait-box dynamic-box"><textarea class="auto-resize" data-field="flaws"></textarea><div class="box-title">FLAWS</div></div>
      </div>

      <div class="features-box dynamic-box"><textarea class="auto-resize" data-field="features"></textarea><div class="box-title">FEATURES &amp; TRAITS</div></div>
    </div>
  </main>
</div>
</template>

<!-- ============== PATHFINDER 2ND EDITION ============== -->
<template id="tpl-pathfinder2e">
<div class="sheet-container">
  <header class="sheet-header">
    <div class="name-container">
      <input type="text" class="h-input char-name-input" placeholder="Character Name" data-field="name">
      <label>CHARACTER NAME</label>
    </div>
    <div class="header-grid">
      <div class="info-cell"><input type="text" class="h-input" data-field="ancestry"><label>ANCESTRY &amp; HERITAGE</label></div>
      <div class="info-cell"><input type="text" class="h-input" data-field="background"><label>BACKGROUND</label></div>
      <div class="info-cell"><input type="text" class="h-input" data-field="class"><label>CLASS</label></div>
      <div class="info-cell"><input type="text" class="h-input" data-field="player"><label>PLAYER</label></div>
      <div class="info-cell"><input type="text" class="h-input" data-field="alignment"><label>ALIGNMENT</label></div>
      <div class="info-cell"><input type="text" class="h-input" data-field="deity"><label>DEITY</label></div>
      <div class="info-cell"><input type="text" class="h-input" data-field="size"><label>SIZE</label></div>
      <div class="info-cell"><input type="text" class="h-input" data-field="traits"><label>TRAITS</label></div>
    </div>
    <div class="header-side">
      <div class="side-box"><input type="text" data-field="hero-points"><label>HERO POINTS</label></div>
      <div class="side-box"><input type="text" data-field="level"><label>LEVEL</label></div>
      <div class="side-box"><input type="text" data-field="xp"><label>XP</label></div>
      <div class="portrait-box card" style="width:60px;height:60px;margin:0;flex-shrink:0;">
        <input type="file" accept="image/*" class="no-print">
        <div class="portrait-overlay no-print" style="font-size:7px;">Portrait</div>
      </div>
    </div>
  </header>

  <nav class="sheet-tabs no-print">
    <button type="button" class="tab-btn active" data-page="char">Character</button>
    <button type="button" class="tab-btn" data-page="feats">Feats &amp; Inventory</button>
    <button type="button" class="tab-btn" data-page="spells">Spells</button>
  </nav>

  <!-- ===== PAGE 1: CHARACTER ===== -->
  <section class="sheet-page" data-page="char">
    <div class="pf-body">
      <div class="pf-left">
        <div class="pf-stats-row">
          <div class="pf-col-a">
            <div class="ability-box card"><label>STR</label><input class="ab-score" data-stat="str" data-field="str" value="10"><input class="ab-mod" id="pf-mod-str" readonly></div>
            <div class="ability-box card"><label>DEX</label><input class="ab-score" data-stat="dex" data-field="dex" value="10"><input class="ab-mod" id="pf-mod-dex" readonly></div>
            <div class="ability-box card"><label>CON</label><input class="ab-score" data-stat="con" data-field="con" value="10"><input class="ab-mod" id="pf-mod-con" readonly></div>
            <div class="ability-box card"><label>INT</label><input class="ab-score" data-stat="int" data-field="int" value="10"><input class="ab-mod" id="pf-mod-int" readonly></div>
            <div class="ability-box card"><label>WIS</label><input class="ab-score" data-stat="wis" data-field="wis" value="10"><input class="ab-mod" id="pf-mod-wis" readonly></div>
            <div class="ability-box card"><label>CHA</label><input class="ab-score" data-stat="cha" data-field="cha" value="10"><input class="ab-mod" id="pf-mod-cha" readonly></div>

            <div class="mini-box card">
              <div class="mini-title">Class DC</div>
              <div class="calc-row" data-dc>
                <select class="ability-select" data-field="classdc-ability"><option value="str">Str</option><option value="dex">Dex</option><option value="con">Con</option><option value="int">Int</option><option value="wis">Wis</option><option value="cha" selected>Cha</option></select>
                <span class="op">=10+</span>
                <input data-role="key" readonly><span class="op">+</span>
                <input data-role="prof" readonly><span class="op">+</span>
                <input data-role="item" data-field="classdc-item" placeholder="0">
              </div>
              <div style="display:flex;justify-content:center;align-items:center;gap:6px;margin-top:4px;">
                <input data-role="total" class="calc-total" readonly>
                <div class="dot-rating teml" data-field="classdc-rank"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div>
              </div>
            </div>

            <div class="mini-box card speed-box">
              <label style="font-family:var(--font-heading);font-size:9px;font-weight:800;">SPEED</label>
              <input class="ft" data-field="speed" placeholder="ft">
              <input class="notes" data-field="speed-notes" placeholder="movement notes">
            </div>
          </div>

          <div class="pf-col-b">
            <div class="mini-box card">
              <div class="mini-title">Armor Class</div>
              <div class="ac-row"><input class="calc-total ac-total" data-field="ac" placeholder="10"></div>
              <div class="armor-prof-list">
                <div class="armor-prof-row"><span>Unarmored</span><div class="dot-rating teml" data-field="prof-unarmored"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div></div>
                <div class="armor-prof-row"><span>Light</span><div class="dot-rating teml" data-field="prof-light"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div></div>
                <div class="armor-prof-row"><span>Medium</span><div class="dot-rating teml" data-field="prof-medium"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div></div>
                <div class="armor-prof-row"><span>Heavy</span><div class="dot-rating teml" data-field="prof-heavy"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div></div>
              </div>
            </div>

            <div class="mini-box card" data-autoname="pf-saves">
              <div class="mini-title">Saving Throws</div>
              <div class="save-row calc-row" data-ability="con"><label>FORT</label><input data-role="key" readonly><span class="op">+</span><input data-role="prof" readonly><span class="op">+</span><input data-role="item" placeholder="0"><input data-role="total" class="calc-total" readonly><div class="dot-rating teml"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div></div>
              <div class="save-row calc-row" data-ability="dex"><label>REF</label><input data-role="key" readonly><span class="op">+</span><input data-role="prof" readonly><span class="op">+</span><input data-role="item" placeholder="0"><input data-role="total" class="calc-total" readonly><div class="dot-rating teml"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div></div>
              <div class="save-row calc-row" data-ability="wis"><label>WILL</label><input data-role="key" readonly><span class="op">+</span><input data-role="prof" readonly><span class="op">+</span><input data-role="item" placeholder="0"><input data-role="total" class="calc-total" readonly><div class="dot-rating teml"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div></div>
            </div>
          </div>

          <div class="pf-col-c">
            <div class="mini-box card">
              <div class="mini-title">Hit Points</div>
              <div class="hp-row">
                <div class="hp-cell"><label>MAX</label><input data-field="hp-max"></div>
                <div class="hp-cell"><label>CURRENT</label><input data-field="hp-current"></div>
                <div class="hp-cell"><label>TEMP</label><input data-field="hp-temp"></div>
              </div>
            </div>

            <div class="mini-box card" data-autoname="pf-perception">
              <div class="mini-title">Perception</div>
              <div class="calc-row" data-ability="wis" style="justify-content:center;">
                <input data-role="key" readonly><span class="op">+</span>
                <input data-role="prof" readonly><span class="op">+</span>
                <input data-role="item" placeholder="0">
                <input data-role="total" class="calc-total" readonly>
                <div class="dot-rating teml"><span class="dot">T</span><span class="dot">E</span><span class="dot">M</span><span class="dot">L</span></div>
              </div>
              <input class="perception-notes" data-field="senses" placeholder="Senses / notes">
            </div>
          </div>
        </div>

        <div class="pf-combat-row">
          <div class="strikes-box card">
